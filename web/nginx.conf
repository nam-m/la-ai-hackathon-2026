server {
  listen 80;
  root /usr/share/nginx/html;
  # Docker's DNS, looked up per request (via the variable below), so a recreated server container is found again.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The server's API routes (API_ROUTES in vite.config.ts, plus /demo). Server down: 502/504 within a few
  # seconds, which the app shows as "can't reach" (the default connect timeout would hang each poll for 60 s).
  location ~ ^/(health|log|facts|summary|settings|creao|demo)(/|$) {
    set $api http://server:8080;
    proxy_pass $api;
    proxy_connect_timeout 3s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # File names under /assets are content-hashed; index.html must always be fresh so new builds load.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
